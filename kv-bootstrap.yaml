apiVersion: v1
kind: Pod
metadata:
  name: kv-bootstrap
  namespace: atpl-crm
spec:
  containers:
    - name: bootstrap
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Key Vault secrets mounted:"
          ls -la /mnt/secrets-store
          sleep 300
      volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: atplcrm-keyvault
