name: ${COMPOSE_PROJECT_NAME:-atplcrm-international}
x-app: &app
  build:
    context: .
    dockerfile: infra/api.Dockerfile
  environment: &environment
    APP_MODE: local-demo
    INSTANCE_TYPE: ${INSTANCE_TYPE:-INTERNATIONAL}
    TENANT_KEY: ${COMPOSE_PROJECT_NAME:-atplcrm-international}
    APP_SECRET: ${APP_SECRET:?Run python3 scripts/bootstrap.py first}
    POSTGRES_DB: atplcrm
    POSTGRES_USER: atplcrm
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
    DEMO_PASSWORD: ${DEMO_PASSWORD:?Run bootstrap first}
    REDIS_URL: redis://redis:6379/0
    FX_RATES_URL: ${FX_RATES_URL:-}
    FX_RATE_SOURCE: ${FX_RATE_SOURCE:-Configured published source}
    ARTIFACT_STORAGE_ROOT: /data/artifacts
    ARTIFACT_MAX_UPLOAD_MB: ${ARTIFACT_MAX_UPLOAD_MB:-10}
    CSRF_TRUSTED_ORIGINS: http://localhost:${PORT:-8082},http://127.0.0.1:${PORT:-8082}
  init: true
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atplcrm
      POSTGRES_USER: atplcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U atplcrm -d atplcrm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - queue:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    restart: 'no'
    command: [sh, -c, 'alembic upgrade head && python -m atplcrm.seed']
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    command: [celery, -A, atplcrm.tasks.celery_app, worker, --loglevel=info, --concurrency=2]
    depends_on:
      api:
        condition: service_healthy
  scheduler:
    <<: *app
    command: [celery, -A, atplcrm.tasks.celery_app, beat, --loglevel=info, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - '127.0.0.1:${PORT:-8082}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  database:
  queue:
  artifacts:
