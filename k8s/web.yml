apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: atpl-crm
spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: yashuraj/atplcrm-web:v1

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: atpl-crm
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
