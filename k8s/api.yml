apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: atpl-crm
spec:
  replicas: 2

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: atplcrmacr.azurecr.io/atplcrm-api:v1
          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: atplcrm-config

          env:
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: atplcrm-secret
                  key: APP_SECRET

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atplcrm-secret
                  key: POSTGRES_PASSWORD

            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atplcrm-secret
                  key: DEMO_PASSWORD

          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts

          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

      volumes:
        - name: artifacts
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: atpl-crm
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
