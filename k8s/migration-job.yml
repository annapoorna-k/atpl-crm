apiVersion: batch/v1
kind: Job
metadata:
  name: atplcrm-migration
  namespace: atpl-crm
spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: atplcrm-migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: atplcrmacr.azurecr.io/atplcrm-migrate:v1

          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Running database migrations..."
              alembic upgrade head

              echo "Running application seed..."
              python -m atplcrm.seed

              echo "Migration and seed completed successfully."

          envFrom:
            - configMapRef:
                name: atplcrm-config

          env:
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: atplcrm-secret
                  key: APP_SECRET

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atplcrm-secret
                  key: POSTGRES_PASSWORD

            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atplcrm-secret
                  key: DEMO_PASSWORD
