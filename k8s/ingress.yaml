apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atplcrm
  namespace: atplcrm
spec:
  ingressClassName: nginx

  rules:
    - host: atplcrm.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: web
                port:
                  number: 8080
