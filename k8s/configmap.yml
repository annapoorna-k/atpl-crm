apiVersion: v1
kind: ConfigMap
metadata:
  name: atplcrm-config
  namespace: atpl-crm
data:
  APP_MODE: "local-demo"
  INSTANCE_TYPE: "INTERNATIONAL"
  TENANT_KEY: "atplcrm-international"

  POSTGRES_HOST: "postgres"
  POSTGRES_DB: "atplcrm"
  POSTGRES_USER: "atplcrm"

  REDIS_URL: "redis://redis:6379/0"

  FX_RATE_SOURCE: "Configured published source"
  ARTIFACT_STORAGE_ROOT: "/data/artifacts"
  ARTIFACT_MAX_UPLOAD_MB: "10"
