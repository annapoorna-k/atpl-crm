name: ATPLCRM checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      APP_SECRET: ci-only-non-production-key
      DATABASE_URL: sqlite+pysqlite:////tmp/atplcrm-ci.db
      POSTGRES_PASSWORD: unused-in-ci
      TENANT_KEY: ci-workspace
      INSTANCE_TYPE: INTERNATIONAL
      DEMO_PASSWORD: ChangeMe1234
      APP_MODE: local-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r apps/api/requirements.lock
      - run: pytest -q
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
